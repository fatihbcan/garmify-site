<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmify</title>
<meta name="description" content="Garmify — your wardrobe, organised. Daily outfit suggestions from the clothes you already own.">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1e; --muted: #5c5c6b; --line: #e5e5ec; --accent: #4c6ef5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --fg: #ececf0; --muted: #a0a0b0; --line: #2c2c34; --accent: #8da2fb; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 520px; text-align: center; }
  .logo { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent); margin: 0 0 12px; }
  .tag { font-size: 19px; color: var(--fg); margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 40px; }
  nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding-top: 28px; border-top: 1px solid var(--line); }
  nav a { color: var(--accent); text-decoration: none; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; }
  nav a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="logo">Garmify</p>
    <p class="tag">Your wardrobe, organised.</p>
    <p class="sub">Photograph your clothes once, and get outfit suggestions built from what you already own — matched to the weather and to your day.</p>
    <nav>
      <a href="legal/privacy/">Privacy Policy</a>
      <a href="legal/terms/">Terms of Service</a>
      <a href="mailto:canfatihberat.support@gmail.com">Support</a>
    </nav>
  </div>
</body>
</html>
